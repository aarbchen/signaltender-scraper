name: Daily 50-State SLED & API Expansion Factory

on:
  schedule:
    # 2:00 AM America/Chicago (CDT is UTC-5 -> 07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout SignalTender Scraper (Daas)
        uses: actions/checkout@v4
        with:
          repository: aarbchen/signaltender-scraper
          path: Daas
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout B2B Contract Parser API (Data API Ecosystem)
        uses: actions/checkout@v4
        with:
          repository: aarbchen/b2b-contract-parser-api
          path: Data API Ecosystem
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Daas/requirements.txt
          pip install -r "Data API Ecosystem/requirements.txt"
          pip install pillow requests python-dotenv

      - name: Configure Git Committer Identity
        run: |
          git config --global user.name "SignalTender Autonomous Factory"
          git config --global user.email "bot@signaltender.net"

      - name: Execute Daily Expansion Runner & Quality Gates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPIDAPI_STUDIO_COOKIE: ${{ secrets.RAPIDAPI_STUDIO_COOKIE }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_VIP_WEBHOOK_URL: ${{ secrets.DISCORD_VIP_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: |
          cd Daas
          python daily_expansion_runner.py

      - name: Push Updates to SignalTender Scraper
        if: success()
        run: |
          cd Daas
          git push origin main || echo "No changes to push in Daas"

      - name: Push Updates to Data API Ecosystem
        if: success()
        run: |
          cd "Data API Ecosystem"
          git push origin main || echo "No changes to push in Data API Ecosystem"
