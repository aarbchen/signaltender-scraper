services:
  - type: cron
    name: daas-contract-scraper
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 playwright install chromium
    startCommand: python mainscraper.py
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_CONTENT_WEBHOOK_URL
        sync: false
      - key: DISCORD_CAPTUREDESK_WEBHOOK_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
